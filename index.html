<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="global.css" />
</head>
<body>

  <main class="bienvenida">

    <section class="portada">
      <h1 class="logotipo">Crypt<span class="logotipo__x">X</span></h1>

      <img class="portada__imagen" src="forma.png" alt="Forma 3D de CryptX" />

      <div class="portada-texto">
        <h2 class="titulo">Jump start your crypto portfolio</h2>
        <p class="texto">Take your investment portfolio to next level</p>
      </div>
    </section>

        
    <article class="tarjeta-cripto">
      <div class="tarjeta-cripto__icono">₿</div>

      <div class="tarjeta-cripto__info">
        <h3 class="tarjeta-cripto__nombre">Bitcoin</h3>
        <span class="tarjeta-cripto__simbolo">BTC</span>
      </div>

      <div class="tarjeta-cripto__precio">
        <p class="tarjeta-cripto__valor">$67,250.00</p>
        <span class="tarjeta-cripto__variacion tarjeta-cripto__variacion--sube">+2.4%</span>
      </div>
    </article>

    <button class="boton">Get Started</button>

  </main>
</body>
</html>
