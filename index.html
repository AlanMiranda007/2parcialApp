<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="global.css" />
</head>
<body>
  <!-- PÁGINA / PLANTILLA -->
  <main class="onboarding">

    <!-- ORGANISMO: Hero -->
    <section class="hero">
      <!-- ÁTOMO: Logo -->
      <h1 class="logo">Crypt<span class="logo__x">X</span></h1>

      <!-- ÁTOMO: Imagen -->
      <img class="hero__image" src="shape.png" alt="Forma 3D CryptX" />

      <!-- MOLÉCULA: Título + descripción -->
      <div class="hero-text">
        <h2 class="title">Jump start your crypto portfolio</h2>
        <p class="text">Take your investment portfolio to next level</p>
      </div>
    </section>

    <!-- ÁTOMO: Botón -->
    <button class="button">Get Started</button>

  </main>
